# Base44 development stack for Croatia Gift Cards.
#
# The app talks to Supabase's PostgREST data API. Locally that means Postgres +
# PostgREST, seeded from the repository's own supabase/migrations. The browser
# only ever talks to port 3000: the Vite dev server proxies /rest/v1 to the API
# (see vite.config.ts), so there is no cross-origin traffic.
#
# The anon key/JWT secret below are the public Supabase local-development
# defaults, not real credentials.
x-anon-key: &anon_key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
x-jwt-secret: &jwt_secret super-secret-jwt-token-with-at-least-32-characters-long

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: base44devpg
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: base44devpg
      DB_NAME: postgres
      AUTHENTICATOR_PASSWORD: base44devpg
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/apply-migrations.sh:/apply-migrations.sh:ro
    command: ["sh", "/apply-migrations.sh"]
    restart: "no"

  api:
    build:
      context: ./docker/postgrest
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:base44devpg@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt_secret
      PGRST_SERVER_PORT: "3000"
      ANON_KEY: *anon_key
    ports:
      - "8000:3000"
    labels:
      base44.project: "Croatia Gift Cards API"
      base44.kind: api
      base44.port: 8000
      base44.docs: /
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null --header=\"apikey: $$ANON_KEY\" --header=\"Authorization: Bearer $$ANON_KEY\" 'http://127.0.0.1:3000/cities?select=id&limit=1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: node:22-bookworm-slim
    restart: on-failure
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    environment:
      # Sandbox-only: enables the Vite /rest/v1 proxy in vite.config.ts.
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      VITE_SUPABASE_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX:-localhost}
      VITE_SUPABASE_ANON_KEY: *anon_key
      # Read by Vite to allow the preview hostname.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    ports:
      - "3000:5173"
    labels:
      base44.project: "Croatia Gift Cards"
      base44.kind: web
      base44.port: 3000
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec npm run dev -- --host 0.0.0.0 --port 5173
    healthcheck:
      # Probes the dev server AND the proxied data API.
      test:
        - CMD-SHELL
        - |
          node -e "const k=process.env.VITE_SUPABASE_ANON_KEY;const h={apikey:k,Authorization:'Bearer '+k};(async()=>{const page=await fetch('http://127.0.0.1:5173/');if(!page.ok)throw new Error('web '+page.status);const api=await fetch('http://127.0.0.1:5173/rest/v1/cities?select=id&limit=1',{headers:h});if(!api.ok)throw new Error('api '+api.status);const rows=await api.json();if(!Array.isArray(rows))throw new Error('api payload');})().catch(e=>{console.error('healthcheck failed:',e.message);process.exit(1)})"
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s

volumes:
  db-data:
  web-node-modules:
